services:
  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: lab_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb7_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongodb7_data: